[package]
name = "webhook_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.86"
anyhow = "1.0.29"
config = "0.15.8"
derive_builder = "0.20.2"
dotenv = "0.15.0"
metrics-exporter-prometheus = "0.17.0"
thiserror = "2.0.12"
serde_json = "1.0.140"
getset = "0.1.5"

[dependencies.chrono]
version = "0.4.41"
features = ["serde"]

[dependencies.tokio]
version = "1.43.0"
features = ["full"]

[dependencies.tower-http]
version = "0.6.2"
features = ["trace", "cors"]

[dependencies.utoipa]
version = "5.3.1"
features = ["axum_extras", "chrono"]

[dependencies.uuid]
version = "1.16.0"
features = [
    "v4", 
    "serde"
]

[dependencies.redis]
optional = true
version = "0.31.0"
features = ["aio", "tokio-comp", "connection-manager", "json"]

[dependencies.serde]
version = "1.0"
features = ["derive"]






